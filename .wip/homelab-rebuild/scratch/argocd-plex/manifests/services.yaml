# Services for Plex and Uptime-Kuma
---
apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: media
spec:
  type: LoadBalancer
  selector:
    app: plex
  ports:
    - name: web
      port: 32400
      targetPort: 32400
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: media
spec:
  type: ClusterIP
  selector:
    app: plex
  ports:
    - name: web
      port: 3001
      targetPort: 3001
