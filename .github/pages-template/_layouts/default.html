<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }} - Dev Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #111827;
      --header-bg: rgba(15, 23, 42, 0.9);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border-color: #334155;
      --border-light: #1e293b;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding-top: 4rem; /* Offset for sticky header */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Sticky Header */
    header.site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 4rem;
      background-color: var(--header-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      z-index: 1000;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
      font-size: 1.2rem;
      font-family: var(--font-mono);
      letter-spacing: -0.02em;
    }

    .brand-icon {
      color: var(--accent);
      font-size: 1.4rem;
    }

    nav.site-nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    nav.site-nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s, background-color 0.2s;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
    }

    nav.site-nav a:hover, nav.site-nav a.active {
      color: var(--accent);
      background-color: var(--border-light);
    }

    /* Global Container */
    main.main-content {
      flex: 1;
      width: 100%;
      margin: 0 auto;
      max-width: 1440px;
    }

    /* Core Markdown Styling */
    .content-area {
      color: var(--text-main);
      font-size: 1.05rem;
    }

    .content-area h1, .content-area h2, .content-area h3, .content-area h4 {
      color: var(--text-main);
      font-weight: 700;
      margin-top: 2rem;
      margin-bottom: 1rem;
      line-height: 1.3;
    }

    .content-area h1 {
      font-size: 2.25rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
      margin-top: 0;
    }

    .content-area h2 {
      font-size: 1.75rem;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 0.4rem;
    }

    .content-area h3 {
      font-size: 1.4rem;
    }

    .content-area p {
      margin-bottom: 1.25rem;
    }

    .content-area a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dashed rgba(56, 189, 248, 0.4);
      transition: border-bottom-color 0.2s, color 0.2s;
    }

    .content-area a:hover {
      color: var(--accent-hover);
      border-bottom-style: solid;
    }

    /* Lists */
    .content-area ul, .content-area ol {
      margin-bottom: 1.25rem;
      padding-left: 1.75rem;
    }

    .content-area li {
      margin-bottom: 0.4rem;
    }

    /* Code Block & Inline Code Formatting */
    code {
      font-family: var(--font-mono);
      font-size: 0.9em;
      background-color: var(--panel-bg);
      color: var(--accent);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    pre {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.25rem;
      overflow-x: auto;
      margin-bottom: 1.5rem;
    }

    pre code {
      background-color: transparent;
      color: var(--text-main);
      padding: 0;
      border-radius: 0;
      border: none;
      font-size: 0.9rem;
      line-height: 1.5;
      display: block;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    th, td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }

    th {
      font-weight: 600;
      background-color: var(--border-light);
      color: var(--accent);
      border-bottom: 2px solid var(--border-color);
    }

    tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.02);
    }

    /* Alerts and Blockquotes */
    blockquote {
      background-color: rgba(56, 189, 248, 0.05);
      border-left: 4px solid var(--accent);
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      border-radius: 0 8px 8px 0;
    }

    blockquote p:last-child {
      margin-bottom: 0;
    }

    /* Images */
    img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 1.5rem 0;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      border: 1px solid;
    }

    .badge-type {
      background-color: rgba(92, 107, 192, 0.15);
      color: #7986cb;
      border-color: rgba(92, 107, 192, 0.3);
    }

    .badge-status {
      background-color: rgba(76, 175, 80, 0.15);
      color: #81c784;
      border-color: rgba(76, 175, 80, 0.3);
    }

    .badge-tag {
      background-color: rgba(148, 163, 184, 0.1);
      color: var(--text-muted);
      border-color: rgba(148, 163, 184, 0.25);
      text-transform: none;
      letter-spacing: normal;
    }

    /* Scrollbar Style */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-color);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Footer */
    footer.site-footer {
      border-top: 1px solid var(--border-light);
      padding: 2rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      background-color: rgba(15, 23, 42, 0.5);
    }

    footer.site-footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer.site-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="{{ '/' | relative_url }}" class="brand-link">
      <span class="brand-icon">⚡</span>
      <span>Workspace Docs</span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/#homelab' | relative_url }}">Homelab</a>
      <a href="{{ '/#guides' | relative_url }}">Guides</a>
      <a href="{{ '/#architecture' | relative_url }}">Architecture</a>
      <a href="{{ '/#talks' | relative_url }}">Talks</a>
    </nav>
  </header>

  <main class="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Personal Documentation Workspace. Powered by Jekyll static sync engine.</p>
  </footer>

</body>
</html>
