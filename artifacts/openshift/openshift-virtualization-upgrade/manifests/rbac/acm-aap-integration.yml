---
type: Reference
---
# RBAC Template: ACM-AAP Integration
# Purpose: Service account and permissions for ACM to trigger AAP jobs
#
# CUSTOMIZATION REQUIRED:
# - Replace <PLACEHOLDERS> with your environment values
# - Adjust namespace to match your ACM deployment
# - Add/remove permissions based on your security requirements
#
# USAGE:
# 1. Replace all <PLACEHOLDERS>
# 2. Review permissions and adjust for your security posture
# 3. Apply with: oc apply -f acm-aap-integration.yml
#
# PLACEHOLDERS:
# - <NAMESPACE>: Namespace for service account (e.g., "open-cluster-management-agent")
# - <SA_NAME>: Service account name (e.g., "ansible-job-runner")
# - <AAP_NAMESPACE>: Namespace where AnsibleJob CRD is installed
# - <AAP_CONTROLLER_URL>: URL of your AAP Controller
#
# DOCUMENTATION:
# - https://docs.ansible.com/automation-controller/latest/html/controlleradmin/cluster_installer.html#rbac

---
# ServiceAccount for ACM to run AnsibleJobs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: <SA_NAME>
  namespace: <NAMESPACE>
  labels:
    app: acm-aap-integration
---
# Role: Permissions to create and manage AnsibleJobs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ansiblejob-manager
  namespace: <AAP_NAMESPACE>
  labels:
    app: acm-aap-integration
rules:
  # Create, read, update, delete AnsibleJobs
  - apiGroups:
      - tower.ansible.com
    resources:
      - ansiblejobs
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete
  
  # Read AnsibleJob status
  - apiGroups:
      - tower.ansible.com
    resources:
      - ansiblejobs/status
    verbs:
      - get
      - list
      - watch
---
# RoleBinding: Grant service account the role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ansiblejob-manager-binding
  namespace: <AAP_NAMESPACE>
  labels:
    app: acm-aap-integration
subjects:
  - kind: ServiceAccount
    name: <SA_NAME>
    namespace: <NAMESPACE>
roleRef:
  kind: Role
  name: ansiblejob-manager
  apiGroup: rbac.authorization.k8s.io
---
# Secret: AAP Controller credentials
# Create this secret with your AAP token
# 
# To get a token from AAP:
# 1. Log in to AAP Controller UI
# 2. User > Token > Create token
# 3. Copy the token value
#
# Or use API:
# curl -k -X POST https://<AAP_CONTROLLER_URL>/api/v2/tokens/ \
#   -H "Authorization: Bearer <YOUR_PASSWORD>" \
#   -d '{"description":"ACM Integration"}'
apiVersion: v1
kind: Secret
metadata:
  name: tower-auth-secret
  namespace: <AAP_NAMESPACE>
  labels:
    app: acm-aap-integration
type: Opaque
stringData:
  # AAP Controller URL (without trailing slash)
  host: "https://<AAP_CONTROLLER_URL>"
  
  # AAP API token (from AAP Controller)
  # SECURITY: Store this in a secret manager and inject at deploy time
  token: "<AAP_API_TOKEN>"
---
# ConfigMap: AAP integration settings (optional)
# Use for environment-specific configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: acm-aap-config
  namespace: <NAMESPACE>
  labels:
    app: acm-aap-integration
data:
  AAP_CONTROLLER_URL: "https://<AAP_CONTROLLER_URL>"
  AAP_NAMESPACE: "<AAP_NAMESPACE>"
  DEFAULT_JOB_TEMPLATE: "VM Migration - Node Evacuation"
  DEFAULT_TIMEOUT: "3600"
---
# OPTIONAL: ClusterRole for cross-namespace access
# Uncomment if you need cluster-wide permissions
#
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRole
# metadata:
#   name: ansiblejob-reader
# rules:
#   - apiGroups:
#       - tower.ansible.com
#     resources:
#       - ansiblejobs
#     verbs:
#       - get
#       - list
#       - watch
#
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRoleBinding
# metadata:
#   name: ansiblejob-reader-binding
# subjects:
#   - kind: ServiceAccount
#     name: <SA_NAME>
#     namespace: <NAMESPACE>
# roleRef:
#   kind: ClusterRole
#   name: ansiblejob-reader
#   apiGroup: rbac.authorization.k8s.io
---
# VERIFICATION
# After applying, verify with:
#
# 1. Check service account exists:
#    oc get sa <SA_NAME> -n <NAMESPACE>
#
# 2. Check role binding:
#    oc get rolebinding ansiblejob-manager-binding -n <AAP_NAMESPACE>
#
# 3. Test AnsibleJob creation:
#    oc apply -f - <<EOF
#    apiVersion: tower.ansible.com/v1alpha1
#    kind: AnsibleJob
#    metadata:
#      name: test-job
#      namespace: <AAP_NAMESPACE>
#    spec:
#      tower_auth_secret: tower-auth-secret
#      job_template_name: "<TEST_JOB_TEMPLATE>"
#    EOF
#
# 4. Check job status:
#    oc get ansiblejob test-job -n <AAP_NAMESPACE> -o yaml
