---
type: Reference
---
# MigrationPolicy: Baseline VM
# Suitable for: Small VMs (<16 GB), low-to-moderate churn
# 
# CALIBRATION NOTE:
# Adjust completionTimeoutPerGiB based on your network configuration.
# See ../../migration-timeout-calculation.md for methodology.
#
# Recommended values:
#   Dedicated 10+ Gbps: 2-5
#   Dedicated 1-10 Gbps: 5-10
#   Shared/overcommitted: 20-50
#
# Before applying:
# 1. Measure actual migration duration with dry-run
# 2. Calculate observed sec/GiB
# 3. Set value with 50% safety margin

apiVersion: kubevirt.io/v1alpha1
kind: MigrationPolicy
metadata:
  name: baseline-vm
  namespace: openshift-cnv  # Adjust to your KubeVirt namespace
spec:
  # Timeout calculation: completionTimeoutPerGiB × VM Memory (GiB)
  # Example: 5 × 16 GiB = 80 seconds max migration time
  completionTimeoutPerGiB: 5
  
  # Parallelism limits
  parallelMigrationsPerCluster: 5
  parallelOutboundMigrationsPerNode: 2
  
  # Bandwidth: 0 = unlimited, or set explicit limit (e.g., "256Mi")
  bandwidthPerMigration: "0"
  
  # Migration mode
  autoConverge: false
  allowPostCopy: false
  
  # Selector: Match VMs labeled with this policy
  selectors:
    virtualMachineInstanceSelector:
      migration-policy: baseline-vm
