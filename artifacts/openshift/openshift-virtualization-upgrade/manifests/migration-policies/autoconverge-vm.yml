---
type: Reference
---
# MigrationPolicy: Auto-Converge VM
# Suitable for: Large VMs (64-256 GB), high churn workloads
#
# TRADE-OFF: CPU throttling forces migration convergence but impacts
# guest workload performance during migration. Use for workloads where
# migration completion is more critical than transient performance.
#
# CALIBRATION NOTE:
# Adjust completionTimeoutPerGiB based on your network configuration.
# See ../../migration-timeout-calculation.md for methodology.
#
# Recommended values:
#   Dedicated 10+ Gbps: 10-15
#   Dedicated 1-10 Gbps: 15-25
#   Shared/overcommitted: 40-80

apiVersion: kubevirt.io/v1alpha1
kind: MigrationPolicy
metadata:
  name: autoconverge-vm
  namespace: openshift-cnv
spec:
  completionTimeoutPerGiB: 15
  
  # Limited parallelism for resource-intensive migrations
  parallelMigrationsPerCluster: 2
  parallelOutboundMigrationsPerNode: 1
  
  # Higher bandwidth allocation
  bandwidthPerMigration: "512Mi"
  
  # Enable auto-converge to force convergence on high-churn workloads
  autoConverge: true
  allowPostCopy: false
  
  selectors:
    virtualMachineInstanceSelector:
      migration-policy: autoconverge-vm
