---
type: Reference
---
# ACM PlacementRule: Target Clusters for Migration Policy
# Purpose: Define which clusters receive the maintenance policy
#
# CUSTOMIZATION REQUIRED:
# - Replace <PLACEHOLDERS> with your environment values
# - Adjust cluster selector labels to match your fleet
# - Configure for single-cluster or multi-cluster scenarios
#
# DOCUMENTATION:
# - https://docs.openshift.com/container-platform/latest/applications/subscription/subscription-managing-placementrules.html

apiVersion: apps.open-cluster-management.io/v1
kind: PlacementRule
metadata:
  name: openshift-virtualization-clusters
  namespace: <POLICY_NAMESPACE>  # e.g., "open-cluster-management-policies"
  labels:
    app: vm-migration
spec:
  # === CLUSTER SELECTOR ===
  # Select clusters by label
  clusterSelector:
    matchLabels:
      # Target only clusters with OpenShift Virtualization installed
      cluster.open-cluster-management.io/openShiftVersion: "4.1x"  # Match your version
      
      # Optional: Target specific environment
      environment: "production"
      
      # Optional: Target clusters with virtualization enabled
      # openshift-virtualization: "enabled"
  
  # === SCHEDULING ===
  # Decide which clusters to target
  clusterConditions:
    - type: ManagedClusterConditionAvailable
      status: "True"
  
  # If you want to target ALL clusters matching selector:
  # (no limit)
  
  # If you want to target specific number of clusters:
  # numberOfClusters: 3  # Only first 3 matching clusters
  
  # === ALTERNATIVE: EXPLICIT CLUSTER LIST ===
  # Instead of selector, explicitly list clusters:
  # clusters:
  #   - name: cluster-1
  #   - name: cluster-2
  #   - name: cluster-3
  
  # === SCHEDULING POLICY ===
  # For multi-cluster upgrades, process in waves:
  # schedulerName: "wave-scheduler"  # Custom scheduler if available
---
# Example: Multi-cluster upgrade waves
# Use multiple PlacementRules for staged rollout:
#
# Wave 1 (canary clusters):
# apiVersion: apps.open-cluster-management.io/v1
# kind: PlacementRule
# metadata:
#   name: upgrade-wave-1
# spec:
#   clusterSelector:
#     matchLabels:
#       upgrade-wave: "1"
#   numberOfClusters: 2
#
# Wave 2 (majority):
# apiVersion: apps.open-cluster-management.io/v1
# kind: PlacementRule
# metadata:
#   name: upgrade-wave-2
# spec:
#   clusterSelector:
#     matchLabels:
#       upgrade-wave: "2"
#   numberOfClusters: 10
#
# Wave 3 (remaining):
# apiVersion: apps.open-cluster-management.io/v1
# kind: PlacementRule
# metadata:
#   name: upgrade-wave-3
# spec:
#   clusterSelector:
#     matchLabels:
#       upgrade-wave: "3"
