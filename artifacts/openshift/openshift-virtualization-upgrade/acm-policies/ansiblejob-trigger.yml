---
type: Reference
---
# AnsibleJob CR: Trigger AAP Job from ACM
# Purpose: Template for creating AnsibleJob resources to trigger AAP jobs
#
# CUSTOMIZATION REQUIRED:
# - Replace <PLACEHOLDERS> with your environment values
# - Configure tower_auth_secret with AAP credentials
# - Map extra_vars to your job template survey
#
# PREREQUISITES:
# - AnsibleJob CRD installed (comes with AAP Operator)
# - tower_auth_secret created with AAP credentials
# - Network connectivity from managed cluster to AAP Controller
#
# DOCUMENTATION:
# - https://docs.ansible.com/automation-controller/latest/html/controlleradmin/cluster_installer.html#ansiblejob-resource

apiVersion: tower.ansible.com/v1alpha1
kind: AnsibleJob
metadata:
  name: <JOB_NAME>  # e.g., "vm-migration-cluster-1"
  namespace: <NAMESPACE>  # Namespace where AnsibleJob CRD is installed
spec:
  # === AAP CONTROLLER CONNECTION ===
  # Secret containing AAP Controller URL and token
  # Create this secret in the same namespace:
  #
  # apiVersion: v1
  # kind: Secret
  # metadata:
  #   name: tower-access
  # stringData:
  #   host: https://aap-controller.example.com
  #   token: <AAP_API_TOKEN>
  tower_auth_secret: <TOWER_AUTH_SECRET>  # e.g., "tower-access"
  
  # === JOB TEMPLATE ===
  # Name of the Job Template in AAP Controller
  # Must match exactly (case-sensitive)
  job_template_name: "<JOB_TEMPLATE_NAME>"  # e.g., "VM Migration - Node Evacuation"
  
  # Alternative: Use workflow template instead of job template
  # workflow_template_name: "<WORKFLOW_NAME>"
  
  # === EXTRA VARIABLES ===
  # Passed to the job template as survey defaults
  # Keys must match survey variable names
  extra_vars:
    # Target node to evacuate
    target_node: "<NODE_NAME>"  # e.g., "worker-01"
    
    # Migration parallelism
    parallel_migrations: "3"
    
    # VM class filter (optional)
    vm_class_filter: "all"
    
    # Fail on error
    fail_on_error: "false"
    
    # Add any custom variables your job template expects
    # custom_var: "custom_value"
  
  # === JOB EXECUTION OPTIONS ===
  # Optional: Override job template settings
  
  # Execution environment
  # execution_environment: "<EE_NAME>"
  
  # Inventory override
  # inventory: "<INVENTORY_NAME>"
  
  # Limit (for multi-host playbooks)
  # limit: "<HOST_PATTERN>"
  
  # Tags (run only tagged tasks)
  # job_tags: "migration,validate"
  
  # Skip tags
  # skip_tags: "debug"
  
  # Verbosity (0-4)
  # verbosity: 2
  
  # Timeout in seconds
  # timeout: 3600
  
  # === STATUS TRACKING ===
  # After creation, check status with:
  # kubectl get ansiblejob <name> -o yaml
  #
  # Status conditions:
  # - Running: Job executing in AAP
  # - Successful: Job completed successfully
  # - Failed: Job failed in AAP
  # - Error: Error creating/communicating with AAP
---
