# hub-clusters chart defaults
# All values are override-able by the hub Application's helm parameters / valueFiles.

# currentHub must be overridden by the hub Application.
# It selects which clusters from clusters.yaml are managed by this Argo CD instance.
currentHub: ""   # required — set via helm.parameters in the hub Application

argocd:
  namespace: openshift-gitops

source:
  repoURL: https://github.com/YOUR-ORG/YOUR-REPO.git
  targetRevision: main
  componentsBasePath: components

destination:
  # Fallback server — overridden per cluster by cluster.server from clusters.yaml.
  server: https://kubernetes.default.svc

# clusters: is populated by clusters.yaml loaded as a valueFile.
# Do not define it here.
clusters: []

# ── Component registry ──────────────────────────────────────────────────────────
componentRegistry:
  nmstate-operator:
    path: components/nmstate/operator
    syncWave: "0"
    description: "NMState Operator installation via OLM (operators-installer)"

  nmstate-instance:
    path: components/nmstate/instance
    syncWave: "5"
    description: "NMState CR — activates the NMState DaemonSet after operator install"

  cert-manager:
    path: components/cert-manager
    description: "cert-manager Operator"
    syncPolicy:
      automated:
        prune: false

  kubevirt-hyperconverged:
    path: components/kubevirt-hyperconverged/operator
    syncWave: "0"
    description: "OpenShift Virtualization Operator"

  nfd-operator:
    path: components/nfd/operator
    syncWave: "0"
    description: "Node Feature Discovery Operator via OLM — detects and labels GPU nodes"

  nfd-instance:
    path: components/nfd/instance
    syncWave: "5"
    description: "NodeFeatureDiscovery CR — activates hardware detection with GPU PCI whitelist"

  nvidia-gpu-operator:
    path: components/nvidia-gpu-operator/operator
    syncWave: "10"
    description: "NVIDIA GPU Operator via OLM — manages driver lifecycle on labeled GPU nodes"
    syncPolicy:
      automated:
        prune: false

  nvidia-gpu-operator-instance:
    path: components/nvidia-gpu-operator/instance
    syncWave: "15"
    description: "ClusterPolicy CR — driver version, upgrade safety, DCGM, device plugin, GPU modes"

# ── ArgoCD sync defaults ────────────────────────────────────────────────────────
defaults:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

# ── AppProject ──────────────────────────────────────────────────────────────────
appProject:
  enabled: true
  sourceRepos:
    - "https://github.com/YOUR-ORG/YOUR-REPO.git"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist: []
  roles: []
