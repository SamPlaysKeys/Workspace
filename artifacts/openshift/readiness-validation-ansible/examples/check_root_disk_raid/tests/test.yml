---
# Smoke-tests for readiness_check_root_disk_raid.
#
# Runs entirely on localhost without a live cluster by injecting pre-cooked
# BareMetalHost JSON via _root_disk_raid_bmh_raw so the role never calls oc.
#
# root_disk_raid_expected_models is defined in the role's vars/main.yml and is
# loaded automatically when the role is included.  No vars_files needed here.
#
# Scenarios covered
# -----------------
# 1. wwn_pass        - WWN hint resolves to a PERC disk             → PASS
# 2. wwn_fail_model  - WWN hint resolves to a non-RAID disk         → FAIL
# 3. wwn_no_match    - WWN hint does not match any storage WWN      → FAIL
# 4. dev_pass        - No WWN; deviceName matches storage.name      → PASS
# 5. dev_altname     - No WWN; deviceName matches alternateNames    → PASS
# 6. dev_no_match    - No WWN; deviceName matches nothing           → FAIL
# 7. no_hint         - Neither wwn nor deviceName set               → FAIL
# 8. dellboss_pass   - No WWN; deviceName matches DELLBOSS VD disk  → PASS
# 9. hpe_smartarray_pass - No WWN; deviceName matches HPE Smart Array disk → PASS

- name: readiness_check_root_disk_raid — scenario 1 (wwn_pass)
  hosts: localhost
  gather_facts: false
  vars:
    readiness_sections: []
    readiness_failures: []
    readiness_warn_count: 0
    # Pre-cook the oc output so no live cluster is needed.
    _root_disk_raid_bmh_raw:
      rc: 0
      stdout: |
        {
          "items": [{
            "metadata": {"name": "master-0"},
            "spec": {"rootDeviceHints": {"wwn": "0x600508e000000000abcdef1234567890"}},
            "status": {"hardware": {"storage": [
              {"name": "/dev/disk/by-path/pci-0000:02:00.0-scsi-0:0:0:0",
               "alternateNames": ["/dev/sda"],
               "wwn": "0x600508e000000000abcdef1234567890",
               "vendor": "DELL", "model": "PERC H745 Frnt"}
            ]}}
          }]
        }
  tasks:
    - name: Run role
      ansible.builtin.include_role:
        name: readiness_check_root_disk_raid
    - name: Assert PASS for master-0
      ansible.builtin.assert:
        that:
          - (_root_disk_raid_results | selectattr('name', 'eq', 'baremetalhost/master-0') | first).status == 'PASS'
        fail_msg: "Expected PASS for wwn_pass scenario, got: {{ _root_disk_raid_results }}"

