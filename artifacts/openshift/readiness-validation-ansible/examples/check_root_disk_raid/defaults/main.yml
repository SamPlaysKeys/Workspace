---
# Namespace containing BareMetalHost resources created by the bare-metal installer.
root_disk_raid_bmh_namespace: openshift-machine-api

# Optional regex applied to BareMetalHost names before evaluation. Empty means
# evaluate every BMH in root_disk_raid_bmh_namespace.
root_disk_raid_bmh_name_regex: ""

# Missing BMH inventory is normally a readiness failure because the root disk
# backing cannot be proven without status.hardware.storage.
root_disk_raid_required: true
