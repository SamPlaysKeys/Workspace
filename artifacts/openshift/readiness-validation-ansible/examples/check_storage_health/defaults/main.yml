---
# Expected PersistentVolume states and storage class configuration.
#
# pv_required_states: list
#   PV phases that are considered healthy. PVs in any other phase are flagged.
#   Standard phases: Available, Bound, Released, Failed
#
# pv_fail_states: list
#   PV phases that immediately produce a FAIL result (not just WARN).
#
# storage_classes_required: list
#   StorageClasses that must exist. required: true → absent = FAIL.
#
# pvc_fail_phases: list
#   PVC phases that produce FAIL (everything else is WARN or PASS).

pv_healthy_phases:
  - "Bound"
  - "Available"

pv_fail_phases:
  - "Failed"

storage_classes_required:
  - name: "standard"
    required: false
  - name: "fast-ssd"
    required: false

pvc_fail_phases:
  - "Lost"

# Namespaces to scan for PVC health. Empty list = all namespaces.
pvc_check_namespaces: []
