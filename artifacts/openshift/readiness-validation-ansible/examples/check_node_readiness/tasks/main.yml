---
# Rule ACCUM-1: Reset result list first.
- name: Reset node readiness results list
  ansible.builtin.set_fact:
    _node_results: []

# Rule CMD-1: changed_when: false - read-only.
# Rule CMD-2: _raw suffix for raw output.
- name: Get all cluster nodes
  ansible.builtin.command:
    cmd: oc get nodes -o json
  register: _nodes_raw
  changed_when: false

# Rule CMD-3: Drop _raw suffix for parsed fact.
- name: Parse node list
  ansible.builtin.set_fact:
    _node_items: "{{ (_nodes_raw.stdout | from_json)['items'] }}"

# Per-node condition evaluation.
# For each node, check the standard node health conditions.
# Rule BOOL-1: OCP API condition statuses are strings. Compare against 'True'/'False'.
# Rule BOOL-2: Use ~ not + for string concatenation in detail field.
# Rule LOOP-1: loop_control label set.
- name: Evaluate node conditions (include-tasks approach)
  ansible.builtin.include_tasks: check_node.yml
  loop: "{{ _node_items }}"
  loop_control:
    label: "{{ item.metadata.name }}"
    loop_var: node_item

# Rule REPORT-1: Console debug block.
# Rule REPORT-2: %-6s alignment, === headers.
- name: Display node readiness report
  ansible.builtin.debug:
    msg: |
      === Node Readiness Report ===
      Total nodes: {{ _node_items | length }}

      --- Node Conditions ---
      {% for r in (_node_results | sort(attribute='name')) %}
      {{ '%-6s' | format(r.status) }} {{ r.name }}
             {{ r.detail }}
      {% endfor %}

      === Summary ===
      PASS : {{ _node_results | selectattr('status', 'eq', 'PASS') | list | length }}
      WARN : {{ _node_results | selectattr('status', 'eq', 'WARN') | list | length }}
      FAIL : {{ _node_results | selectattr('status', 'eq', 'FAIL') | list | length }}

      {% if expected_node_count | int > 0 %}
      Node count check: expected={{ expected_node_count }}, actual={{ _node_items | length }}
      {% endif %}

# Optional node count check.
- name: Check expected node count
  ansible.builtin.set_fact:
    _node_results: >-
      {{
        _node_results + [{
          'name': 'node-count',
          'status': (_node_items | length == expected_node_count | int) | ternary('PASS', 'FAIL'),
          'detail': 'expected=' ~ expected_node_count ~ '  actual=' ~ (_node_items | length),
          'required': true
        }]
      }}
  when: expected_node_count | int > 0

# Rule REPORT-3: Append a structured section dict to readiness_sections.
# Rule STATE-3:  readiness_sections + [...] only — never replace.
- name: Append node readiness section to readiness_sections
  vars:
    _pass: "{{ _node_results | selectattr('status', 'eq', 'PASS') | list | length }}"
    _warn: "{{ _node_results | selectattr('status', 'eq', 'WARN') | list | length }}"
    _fail: "{{ _node_results | selectattr('status', 'eq', 'FAIL') | list | length }}"
  ansible.builtin.set_fact:
    readiness_sections: >-
      {{
        readiness_sections + [{
          'section': 'node_readiness',
          'pass': _pass | int,
          'warn': _warn | int,
          'fail': _fail | int,
          'results': _node_results
        }]
      }}

# Rule REPORT-4: Increment the shared warn count.
# Rule STATE-4:  Add to existing count, never replace.
- name: Update shared warn count
  ansible.builtin.set_fact:
    readiness_warn_count: >-
      {{ (readiness_warn_count | default(0) | int) + (_node_results | selectattr('status', 'eq', 'WARN') | list | length) }}
  when: _node_results | selectattr('status', 'eq', 'WARN') | list | length > 0

# Rule FAIL-1: Never call ansible.builtin.fail here.
# Rule FAIL-2: Message format: role_name: N check(s) failed - see Report above.
# Rule FAIL-3: Conditional on actual failures.
# Rule STATE-2: Append to existing readiness_failures, never replace.
- name: Record node readiness failures
  ansible.builtin.set_fact:
    readiness_failures: >-
      {{
        (readiness_failures | default([])) +
        ['readiness_check_node_readiness: ' ~
         (_node_results | selectattr('status', 'eq', 'FAIL') | list | length | string) ~
          ' required check(s) failed - see Node Readiness Report above']
      }}
  when: _node_results | selectattr('status', 'eq', 'FAIL') | list | length > 0
