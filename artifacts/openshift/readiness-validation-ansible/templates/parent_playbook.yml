---
# Parent playbook template — readiness validation suite
#
# Usage:
#   ansible-playbook readiness_validation.yml -i inventory
#   ansible-playbook readiness_validation.yml -i inventory --tags software-versions
#   ansible-playbook readiness_validation.yml -i inventory --tags readiness-validation
#
# Required variables (set in AAP job template or extra vars):
#   cluster_name              — short cluster name (used to construct kubeconfig path)
#   bastion_fqdn              — FQDN of the bastion host
#   ansible_user              — SSH user on the bastion

# ── Play 1: Bootstrap ─────────────────────────────────────────────────────────
- name: Add bastion to bastion group
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - required
    - readiness-validation
  tasks:
    - name: Add {{ bastion_fqdn }} to bastion group
      ansible.builtin.add_host:
        name: "{{ bastion_fqdn }}"
        groups: bastion_group

# ── Play 2: Initialize shared facts ──────────────────────────────────────────
# Rule ARCH-3: Set ocp_kubeconfig, readiness_failures, and readiness_report_md here.
# Rule KUBE-1: ocp_kubeconfig is a host fact derived from runtime variables.
- name: Readiness validation — initialize shared facts
  hosts: bastion_group
  gather_facts: false
  tags:
    - readiness-validation
  tasks:
    - name: Initialize readiness facts and report header
      ansible.builtin.set_fact:
        ocp_kubeconfig: "/home/{{ ansible_user | lower }}/{{ cluster_name }}/auth/kubeconfig"
        readiness_failures: []
        readiness_report_md: |
          # Cluster Readiness Report
          **Cluster:** {{ cluster_name }}
          **Bastion:** {{ bastion_fqdn }}
          **Generated:** {{ lookup('pipe', 'date -u +"%Y-%m-%d %H:%M UTC"') }}

          ---

# ── Play 3..N: One play per role ──────────────────────────────────────────────
# Rule ARCH-2: gather_facts: false, environment: KUBECONFIG at play level.
# Rule ARCH-5: Two tags per play — global + specific.
- name: Readiness validation — <check description>
  hosts: bastion_group
  gather_facts: false
  environment:
    KUBECONFIG: "{{ ocp_kubeconfig }}"
  tags:
    - readiness-validation
    - <specific-tag>
  roles:
    - readiness_<check_name>

# Add one play block per role, repeating the pattern above.

# ── Final gate play ───────────────────────────────────────────────────────────
# Rule ARCH-4: Append summary, publish via set_stats, then fail if any failures.
# Rule REPORT-7: set_stats publishes the markdown report as an AAP artifact.
- name: Readiness validation — final gate
  hosts: bastion_group
  gather_facts: false
  tags:
    - readiness-validation
  tasks:
    - name: Append validation summary to report
      vars:
        _summary: |

          ---

          ## Validation Summary

          {% if readiness_failures | default([]) | length == 0 %}
          **Result: PASS** — All readiness checks completed without failures.
          {% else %}
          **Result: FAIL**

          The following checks recorded failures:
          {% for f in readiness_failures | default([]) %}
          - {{ f }}
          {% endfor %}
          {% endif %}
      ansible.builtin.set_fact:
        readiness_report_md: "{{ readiness_report_md + _summary }}"

    - name: Publish readiness report as AAP artifact
      ansible.builtin.set_stats:
        data:
          readiness_report_md: "{{ readiness_report_md }}"
        aggregate: false

    - name: Fail if any readiness checks recorded failures
      ansible.builtin.fail:
        msg: |
          Readiness validation completed with failures:
          {% for f in readiness_failures %}
          - {{ f }}
          {% endfor %}
          Review the role reports above for details.
      when: readiness_failures | default([]) | length > 0
