---
# Parent playbook template — readiness validation suite
#
# Usage:
#   ansible-playbook readiness_validation.yml -i inventory
#   ansible-playbook readiness_validation.yml -i inventory --tags software-versions
#   ansible-playbook readiness_validation.yml -i inventory --tags readiness-validation
#
# Required variables (set in job template or extra vars):
#   openshift_cluster_name        — short cluster name (used to construct kubeconfig path)
#   openshift_bastion_host_fqdn   — FQDN of the bastion host
#   ansible_user                  — SSH user on the bastion

# ── Play 1: Bootstrap ─────────────────────────────────────────────────────────
- name: Add bastion to bastion group
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - required
    - readiness-validation
  tasks:
    - name: Add {{ openshift_bastion_host_fqdn }} to bastion group
      ansible.builtin.add_host:
        name: "{{ openshift_bastion_host_fqdn }}"
        groups: bastion_group

# ── Play 2: Initialize shared facts ──────────────────────────────────────────
# Rule ARCH-3: Set ocp_kubeconfig, readiness_failures, readiness_sections, readiness_warn_count here.
# Rule KUBE-1: ocp_kubeconfig is a host fact derived from runtime variables.
- name: Readiness validation — initialize shared facts
  hosts: bastion_group
  gather_facts: false
  tags:
    - readiness-validation
  tasks:
    - name: Initialize readiness facts
      ansible.builtin.set_fact:
        ocp_kubeconfig: "/home/{{ ansible_user | lower }}/{{ openshift_cluster_name }}/auth/kubeconfig"
        readiness_failures: []
        readiness_sections: []
        readiness_warn_count: 0

# ── Play 3..N: One play per role ──────────────────────────────────────────────
# Rule ARCH-2: gather_facts: false, environment: KUBECONFIG at play level.
# Rule ARCH-5: Two tags per play — global + specific.
- name: Readiness validation — <check description>
  hosts: bastion_group
  gather_facts: false
  environment:
    KUBECONFIG: "{{ ocp_kubeconfig }}"
  tags:
    - readiness-validation
    - <specific-tag>
  roles:
    - readiness_<check_name>

# Add one play block per role, repeating the pattern above.

# ── Final gate play ───────────────────────────────────────────────────────────
# Rule ARCH-4: Publish structured readiness_report via set_stats, then fail if any failures.
# Rule REPORT-6: set_stats publishes the structured report as an AAP artifact.
- name: Readiness validation — final gate
  hosts: bastion_group
  gather_facts: false
  tags:
    - readiness-validation
  tasks:
    - name: Publish readiness report as AAP artifact
      vars:
        _fail_count: "{{ readiness_failures | default([]) | length }}"
        _warn_count: "{{ readiness_warn_count | default(0) | int }}"
      ansible.builtin.set_stats:
        data:
          readiness_report:
            summary:
              cluster: "{{ openshift_cluster_name }}"
              bastion: "{{ openshift_bastion_host_fqdn }}"
              generated: "{{ lookup('pipe', 'date -u +\"%Y-%m-%d %H:%M UTC\"') }}"
              result: "{{ (_fail_count | int > 0) | ternary('FAIL', 'PASS') }}"
              failures: "{{ _fail_count | int }}"
              warnings: "{{ _warn_count | int }}"
              warnings_note: >-
                {{
                  (_warn_count | int > 0)
                  | ternary(
                      _warn_count | string ~ ' warning(s) recorded across all checks — see detailed sections for breakdown.',
                      'No warnings.'
                    )
                }}
              failure_detail: "{{ readiness_failures | default([]) }}"
            sections: "{{ readiness_sections }}"
        aggregate: false

    - name: Fail if any readiness checks recorded failures
      ansible.builtin.fail:
        msg: |
          Readiness validation completed with failures:
          {% for f in readiness_failures %}
          - {{ f }}
          {% endfor %}
          Review the role reports above for details.
      when: readiness_failures | default([]) | length > 0
