---
# tasks/main.yml — readiness_<check_name>
#
# Rule ACCUM-1: Always reset the result list first.
- name: Reset <check_name> results list
  ansible.builtin.set_fact:
    _results: []

# ── Data collection ───────────────────────────────────────────────────────────
# Rule CMD-1: changed_when: false on all read-only commands.
# Rule CMD-2: Register names end in _raw for raw output.
- name: <REPLACE: describe what you are fetching>
  ansible.builtin.command:
    cmd: <REPLACE: oc get ... -o json>
  register: _raw
  changed_when: false

# Rule CMD-3: Parse raw output into a clean fact, dropping the _raw suffix.
- name: Parse <resource> list
  ansible.builtin.set_fact:
    _items: "{{ (_raw.stdout | from_json)['items'] }}"

# ── Evaluation loop ───────────────────────────────────────────────────────────
# Rule ACCUM-2: Accumulate results via set_fact in a loop.
# Rule ACCUM-3: Each entry must have name, status, detail.
# Rule BOOL-1:  Compare OCP API condition booleans against 'true'/'false' (YAML bools).
# Rule BOOL-2:  Use ~ not + for string concatenation.
# Rule LOOP-1:  Always set loop_control label.
- name: Evaluate each <resource>
  vars:
    # Rule OCP-1: Extract conditions with selectattr + first + default.
    _condition_a: >-
      {{ item.status.conditions
         | selectattr('type', 'eq', 'ConditionTypeA')
         | map(attribute='status')
         | first
         | default('Unknown') }}
    _condition_b: >-
      {{ item.status.conditions
         | selectattr('type', 'eq', 'ConditionTypeB')
         | map(attribute='status')
         | first
         | default('Unknown') }}
  ansible.builtin.set_fact:
    _results: >-
      {{
        _results + [{
          'name': item.metadata.name,
          # Rule STATUS-4: Nested ternary for multi-branch status logic.
          # Rule OCP-2: Compare against YAML bool literals.
          'status': (
            (_condition_a == false)
            | ternary('FAIL',
              (_condition_b == true)
              | ternary('WARN', 'PASS')
            )
          ),
          # Rule BOOL-2: ~ for concatenation (safe when conditions are booleans).
          'detail': (
            'ConditionA=' ~ _condition_a
            ~ '  ConditionB=' ~ _condition_b
          ),
          'required': true
        }]
      }}
  loop: "{{ _items }}"
  loop_control:
    label: "{{ item.metadata.name }}"

# ── Console report ────────────────────────────────────────────────────────────
# Rule REPORT-1: Debug block with structured output.
# Rule REPORT-2: Use '%-6s' | format(r.status) for alignment.
- name: Display <check_name> report
  ansible.builtin.debug:
    msg: |
      === <Check Name> Report ===

      --- <Section Name> ---
      {% for r in (_results | sort(attribute='name')) %}
      {{ '%-6s' | format(r.status) }} {{ r.name }}
             {{ r.detail }}
      {% endfor %}

      === Summary ===
      PASS : {{ _results | selectattr('status', 'eq', 'PASS') | list | length }}
      WARN : {{ _results | selectattr('status', 'eq', 'WARN') | list | length }}
      FAIL : {{ _results | selectattr('status', 'eq', 'FAIL') | list | length }}

# ── Failure deferral ──────────────────────────────────────────────────────────
# Rule FAIL-1: Roles never call ansible.builtin.fail.
# Rule FAIL-2: Failure message includes role name, count, and pointer to report.
# Rule FAIL-3: Conditional on actual failures.
# Rule STATE-2: Always (readiness_failures | default([])) + [...] — never replace.
- name: Record <check_name> failures
  ansible.builtin.set_fact:
    readiness_failures: >-
      {{
        (readiness_failures | default([])) +
        ['readiness_<check_name>: ' +
         (_results | selectattr('status', 'eq', 'FAIL') | list | length | string) +
         ' required check(s) failed — see <Check Name> Report above']
      }}
  when: _results | selectattr('status', 'eq', 'FAIL') | list | length > 0

# ── Markdown report ───────────────────────────────────────────────────────────
# Rule REPORT-3: Append a section to readiness_report_md (never replace it).
# Rule REPORT-4: Use -%} in for loops to suppress blank rows in tables.
# Rule REPORT-5: Summary format **PASS:** N &nbsp; **WARN:** N &nbsp; **FAIL:** N
# Rule REPORT-6: Sort result tables by name.
# Rule STATE-3: readiness_report_md + _section only — never replace.
- name: Append <check_name> section to readiness report
  vars:
    _section: |

      ## <Check Name>

      | Status | Name | Detail |
      |--------|------|--------|
      {% for r in (_results | sort(attribute='name')) -%}
      | {{ r.status }} | {{ r.name }} | {{ r.detail }} |
      {% endfor %}
      **PASS:** {{ _results | selectattr('status', 'eq', 'PASS') | list | length }} &nbsp;
      **WARN:** {{ _results | selectattr('status', 'eq', 'WARN') | list | length }} &nbsp;
      **FAIL:** {{ _results | selectattr('status', 'eq', 'FAIL') | list | length }}

  ansible.builtin.set_fact:
    readiness_report_md: "{{ readiness_report_md + _section }}"
