---
# defaults/main.yml — <REPLACE: role description>
#
# This file is the single source of truth for the checks this role performs.
# Update this file when the cluster's authorized configuration changes.
#
# REQUIRED VARIABLES (consumed by tasks/main.yml — do not remove):
#   <check_items>       List or dict of items to check against
#   <expected_values>   Expected values or version patterns
#
# OPTIONAL OVERRIDES:
#   Each item carries a 'required' boolean:
#     true  → absent/failed check = FAIL (playbook fails at gate)
#     false → absent/failed check = WARN only

# Example: a flat list of things to check
# <check_items>:
#   - name: "some-thing"
#     required: true
#     expected: "some-value"

# Example: a knowledge base dict (keyed by item name)
# <knowledge_base>:
#   SomeKnownCondition:
#     category: "known_fix"        # known_silence | do_not_silence | known_fix
#     explanation: "Why this fires"
#     remediation: "What to do"
#     reference: "https://..."
