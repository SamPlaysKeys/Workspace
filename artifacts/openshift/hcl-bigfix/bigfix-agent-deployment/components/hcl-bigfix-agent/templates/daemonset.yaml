---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hcl-bigfix-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: hcl-bigfix-agent
spec:
  selector:
    matchLabels:
      app: hcl-bigfix-agent
  template:
    metadata:
      labels:
        app: hcl-bigfix-agent
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      hostNetwork: true
      hostPID: true
      tolerations:
        # Run on control-plane/master nodes as well
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: besclient
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Mount host root to inspect/remediate the node's underlying host OS
            - name: host-root
              mountPath: /host
              readOnly: false
            # Persist BESClient database, logs, and state on the host
            - name: client-state
              mountPath: /var/opt/BESClient
            # Inject actionsite.afxm masthead
            - name: masthead
              mountPath: /etc/opt/BESClient/actionsite.afxm
              subPath: actionsite.afxm
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: client-state
          hostPath:
            path: /var/opt/BESClient
            type: DirectoryOrCreate
        - name: masthead
          secret:
            secretName: bigfix-agent-masthead
