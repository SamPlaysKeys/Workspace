<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Construction | SamPlaysKeys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121312;
      --surface: #191b1a;
      --text: #e8e6e1;
      --muted: #a4a09a;
      --accent: #4f98a3;
      --border: rgba(255,255,255,.1);
      --shadow: 0 18px 40px rgba(0,0,0,.32);
    }

    [data-theme="light"] {
      --bg: #f5f4f0;
      --surface: #fcfbf8;
      --text: #1f1d18;
      --muted: #6f6c65;
      --accent: #0f766e;
      --border: rgba(31,29,24,.12);
      --shadow: 0 12px 28px rgba(0,0,0,.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, color-mix(in oklab, var(--accent) 12%, transparent), transparent 40%), var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem 2rem;
      box-shadow: var(--shadow);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0 0 1rem;
    }

    p {
      color: var(--muted);
      font-size: 1.125rem;
      margin: 0 0 2.5rem;
    }

    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: 99px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }

    .link:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .link svg {
      opacity: 0.8;
    }

    .theme-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">
    <!-- SVG will be injected by script -->
  </button>

  <main class="container">
    <div class="card">
      <h1>Under Construction</h1>
      <p>This page is currently being built. Please check back soon for updates.</p>
      
      <div class="links">
        <a href="https://github.com/SamPlaysKeys" class="link" target="_blank" rel="noopener">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
          GitHub
        </a>
        <a href="https://twitter.com/SamPlaysKeys" class="link" target="_blank" rel="noopener">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"></path></svg>
          Twitter
        </a>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const btn = document.querySelector('[data-theme-toggle]');
      const root = document.documentElement;
      let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      
      const render = () => {
        root.setAttribute('data-theme', theme);
        btn.innerHTML = theme === 'dark'
          ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
          : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      };

      render();
      btn.addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        render();
      });
    })();
  </script>
</body>
</html>
