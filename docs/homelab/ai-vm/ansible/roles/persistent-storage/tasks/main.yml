---
- name: Check if persistent device has a filesystem
  command: blkid -s TYPE -o value "{{ persistent_device }}"
  register: blkid_result
  changed_when: no
  failed_when: no

- name: Format persistent device if empty
  filesystem:
    fstype: ext4
    dev: "{{ persistent_device }}"
  when: blkid_result.stdout == ""

- name: Create mount point
  file:
    path: "{{ persistent_mount }}"
    state: directory
    owner: "{{ lf_user }}"
    group: "{{ lf_group }}"
    mode: 0755

- name: Mount persistent device
  mount:
    path: "{{ persistent_mount }}"
    src: "{{ persistent_device }}"
    fstype: ext4
    opts: defaults,noatime
    state: mounted

- name: Create LlamaFarm data directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ lf_user }}"
    group: "{{ lf_group }}"
    mode: 0755
  loop:
    - "{{ lf_data_dir }}/bin"
    - "{{ hf_cache_dir }}/hub"
    - "{{ lf_data_dir }}/projects"
