# HyperConverged CR: Aggressive Workload Update Strategy

Fast updates for tight maintenance windows.

## Configuration

```yaml
apiVersion: hco.kubevirt.io/v1beta1
kind: HyperConverged
metadata:
  name: kubevirt-hyperconverged
  namespace: openshift-cnv
spec:
  virtualization:
    # Aggressive workload update strategy
    workloadUpdateStrategy:
      workloadUpdateMethods:
      - LiveMigrate    # Primary: migrate running VMs
      - Evict          # Fallback: restart VMs that can't migrate
      batchEvictionSize: 20           # Larger batch: more parallelism
      batchEvictionInterval: "30s"    # Shorter interval: faster progression

    # Live migration configuration
    liveMigrationConfig:
      completionTimeoutPerGiB: 5      # Adjust based on network
      parallelMigrationsPerCluster: 10  # More parallel migrations
      parallelOutboundMigrationsPerNode: 3
      bandwidthPerMigration: "0"      # Unlimited

    # Additional virtualization settings
    # TODO: Add any site-specific configurations
```

## Apply Configuration

```bash
oc apply -f aggressive-workload-update.yml
```

Or patch existing HyperConverged CR:

```bash
oc patch -n openshift-cnv hco kubevirt-hyperconverged \
  --type=merge \
  -p '{"spec": {"virtualization": {"workloadUpdateStrategy": {"workloadUpdateMethods": ["LiveMigrate","Evict"], "batchEvictionSize": 20, "batchEvictionInterval": "30s"}}}}'
```

## Characteristics

| Setting | Value | Rationale |
|---------|-------|-----------|
| Update methods | LiveMigrate + Evict | Complete all VMs quickly |
| Batch size | 20 | High parallelism |
| Batch interval | 30 seconds | Fast progression |
| Parallel migrations | 10 cluster-wide | More concurrent operations |

## Prerequisites

- Sufficient cluster capacity (CPU, memory) for parallel migrations
- Network bandwidth supports multiple simultaneous migrations
- VMs can tolerate potential resource contention during updates

## Use When

- Tight maintenance windows (< 2 hours)
- Test/dev environments
- Sufficient cluster capacity confirmed
- Non-critical workloads

## Risks

- Higher resource contention during updates
- Potential for migration timeouts if network bandwidth insufficient
- More VMs affected if issues occur mid-batch

