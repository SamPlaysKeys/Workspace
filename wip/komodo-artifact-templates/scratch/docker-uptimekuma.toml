# Komodo Service: Uptime Kuma (Docker)
# Purpose: Self-hosted monitoring tool
# Docs: https://github.com/louislam/uptime-kuma

[repo]
url = "{{ repo_url }}"
branch = "main"
path = ".komodo/uptime-kuma"

[service]
name = "uptime-kuma"
description = "Uptime monitoring and status page"

[schedule]
interval = "300s"

[[job]]
name = "deploy"
description = "Ensure Uptime Kuma container is running"

[stack]
reference = "docker-uptimekuma"

# Persist data outside container
[env]
DATA_DIR = "/path/to/persistent/storage"

[health]
endpoint = "http://localhost:3001/api/status"
interval = "60s"
retries = 3

# Port mapping (if needed)
[port]
"3001" = "3001"