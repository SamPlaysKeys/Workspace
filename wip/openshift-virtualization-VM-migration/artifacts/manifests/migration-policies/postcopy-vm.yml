---
type: Reference
---
# MigrationPolicy: Post-Copy VM
# Suitable for: Very large VMs (>256 GB), extreme churn workloads
#
# WARNING: Post-copy migration carries higher risk.
# If failure occurs during post-copy phase, VM state may be unrecoverable.
# Requires explicit approval for production workloads.
#
# Only enable for VMs where:
# 1. Pre-copy migration consistently fails to converge
# 2. Downtime is more costly than recovery risk
# 3. You have tested rollback procedures
#
# CALIBRATION NOTE:
# Adjust completionTimeoutPerGiB based on your network configuration.
# See ../../migration-timeout-calculation.md for methodology.
#
# Recommended values:
#   Dedicated 10+ Gbps: 15-20
#   Dedicated 1-10 Gbps: 20-30
#   Shared/overcommitted: 50-100

apiVersion: kubevirt.io/v1alpha1
kind: MigrationPolicy
metadata:
  name: postcopy-vm
  namespace: openshift-cnv
spec:
  completionTimeoutPerGiB: 20
  
  # Single migration at a time for very large VMs
  parallelMigrationsPerCluster: 1
  parallelOutboundMigrationsPerNode: 1
  
  # Unlimited bandwidth for fastest possible transfer
  bandwidthPerMigration: "0"
  
  # Enable both auto-converge and post-copy
  autoConverge: true
  allowPostCopy: true
  
  selectors:
    virtualMachineInstanceSelector:
      migration-policy: postcopy-vm
