---
# Playbook: Site Upgrade - Full Workflow
# Purpose: Orchestrate complete node upgrade workflow
#
# This playbook imports the individual playbooks in sequence:
# 1. Classify VMs with appropriate migration policies
# 2. Migrate VMs off target node
# 3. Validate migrations succeeded
# 4. Drain and upgrade node (placeholder - requires customization)
# 5. Return node to service
#
# CUSTOMIZATION REQUIRED:
# - Define upgrade sequence for your environment
# - Add node drain and upgrade logic
# - Set up approval gates between phases
# - Configure rollback triggers
#
# USAGE:
# ansible-playbook site-upgrade.yml -e "target_node=worker-01"
#
# PREREQUISITES:
# - All individual playbooks tested and customized
# - Access to OpenShift API
# - Node drain/upgrade automation defined

- name: Site Upgrade - Full Workflow
  hosts: localhost
  gather_facts: false
  vars:
    # Target node for this upgrade cycle
    target_node: ""
    
    # Enable approval gates between phases
    interactive_mode: true
    
    # Rollback on failure
    auto_rollback: false
    
  tasks:
    - name: Validate target_node is set
      ansible.builtin.assert:
        that:
          - target_node | length > 0
        fail_msg: "target_node variable is required"
        success_msg: "Starting upgrade workflow for node: {{ target_node }}"
    
    - name: Phase 1 - Classify VMs
      ansible.builtin.debug:
        msg: "Phase 1: Classifying VMs for migration policy assignment"
    
    - name: Import classify VMs playbook
      ansible.builtin.import_tasks:
        file: 01-classify-vms.yml
      tags:
        - classify
    
    - name: Approval gate - Continue with migration?
      ansible.builtin.pause:
        prompt: "VM classification complete. Press ENTER to continue with migration, Ctrl+C to abort"
      when: interactive_mode | bool
    
    - name: Phase 2 - Migrate VMs
      ansible.builtin.debug:
        msg: "Phase 2: Migrating VMs from {{ target_node }}"
    
    - name: Import migrate VMs playbook
      ansible.builtin.import_tasks:
        file: 02-migrate-vms.yml
      vars:
        target_node: "{{ target_node }}"
      tags:
        - migrate
    
    - name: Approval gate - Continue with validation?
      ansible.builtin.pause:
        prompt: "VM migration complete. Press ENTER to validate, Ctrl+C to abort"
      when: interactive_mode | bool
    
    - name: Phase 3 - Validate Migrations
      ansible.builtin.debug:
        msg: "Phase 3: Validating VM migrations"
    
    - name: Import validate migration playbook
      ansible.builtin.import_tasks:
        file: 03-validate-migration.yml
      vars:
        evacuated_node: "{{ target_node }}"
      tags:
        - validate
    
    - name: Approval gate - Continue with node drain?
      ansible.builtin.pause:
        prompt: "Migration validation complete. Press ENTER to drain node, Ctrl+C to abort"
      when: interactive_mode | bool
    
    - name: Phase 4 - Drain and Upgrade Node
      ansible.builtin.debug:
        msg: "Phase 4: Draining and upgrading node {{ target_node }}"
    
    - name: Placeholder - Node drain and upgrade
      ansible.builtin.debug:
        msg: |
          TODO: Implement node drain and upgrade
          
          Options:
          
          1. Use OpenShift MachineConfigPool approach:
             - Mark node as unschedulable
             - Wait for MCP to apply updates
             - Node reboots automatically
          
          2. Manual drain and upgrade:
             - oc adm drain {{ target_node }} --ignore-daemonsets --delete-emptydir-data
             - Trigger upgrade via OpenShift API
             - Monitor upgrade progress
          
          3. Use OpenShift update service:
             - Trigger cluster update
             - Nodes upgrade in sequence
          
          Example kubernetes.core.k8s task:
          - name: Cordon node
            kubernetes.core.k8s:
              state: present
              definition:
                apiVersion: v1
                kind: Node
                metadata:
                  name: "{{ target_node }}"
                spec:
                  unschedulable: true
    
    - name: Phase 5 - Return Node to Service
      ansible.builtin.debug:
        msg: "Phase 5: Returning node {{ target_node }} to service"
    
    - name: Placeholder - Uncordon node
      ansible.builtin.debug:
        msg: |
          TODO: Return node to service
          
          Example:
          - name: Uncordon node
            kubernetes.core.k8s:
              state: present
              definition:
                apiVersion: v1
                kind: Node
                metadata:
                  name: "{{ target_node }}"
                spec:
                  unschedulable: false
    
    - name: Upgrade complete
      ansible.builtin.debug:
        msg: "Upgrade workflow complete for node {{ target_node }}"
