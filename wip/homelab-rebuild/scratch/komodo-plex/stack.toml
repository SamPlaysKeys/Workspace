# Komodo Resource Sync — Plex Stack Definition
# This TOML tells Komodo where to find and how to deploy the stack

[[stack]]
name = "plex-media"
description = "Plex Media Server with Uptime-Kuma monitoring"
tags = ["media", "prod"]

[stack.config]
server = "prod-docker"
run_directory = "/opt/stacks/plex-media"
file_paths = ["compose.yaml"]
git_account = "my-github"
repo = "myorg/homelab-stacks"
branch = "main"
auto_update = true
send_alerts = true

environment = """
PLEX_CLAIM=claim-xxxxxxxxxxxx
TZ=America/New_York
PUID=1000
PGID=1000
"""
