# ArgoCD Application — points to the Plex manifests
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plex-media
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/myorg/homelab-k8s
    targetRevision: main
    path: apps/plex
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
