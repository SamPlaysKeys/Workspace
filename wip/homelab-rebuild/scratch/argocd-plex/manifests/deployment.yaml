# Plex Deployment with Uptime-Kuma sidecar
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: media
  labels:
    app: plex
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      runtimeClassName: nvidia
      containers:
        # Main Plex container
        - name: plex
          image: linuxserver/plex:latest
          ports:
            - containerPort: 32400
              name: plex-web
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
            - name: VERSION
              value: "docker"
            - name: PLEX_CLAIM
              valueFrom:
                secretKeyRef:
                  name: plex-secrets
                  key: claim-token
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: config
              mountPath: /config
            - name: movies
              mountPath: /movies
              readOnly: true
            - name: shows
              mountPath: /shows
              readOnly: true
            - name: anime
              mountPath: /anime
              readOnly: true
            - name: transcode
              mountPath: /transcode

        # Uptime-Kuma sidecar for monitoring
        - name: uptime-kuma
          image: louislam/uptime-kuma:latest
          ports:
            - containerPort: 3001
              name: kuma-web
          volumeMounts:
            - name: kuma-data
              mountPath: /app/data

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: plex-config
        - name: movies
          hostPath:
            path: /mnt/media/movies
            type: Directory
        - name: shows
          hostPath:
            path: /mnt/media/shows
            type: Directory
        - name: anime
          hostPath:
            path: /mnt/media/anime
            type: Directory
        - name: transcode
          emptyDir:
            medium: Memory
        - name: kuma-data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
