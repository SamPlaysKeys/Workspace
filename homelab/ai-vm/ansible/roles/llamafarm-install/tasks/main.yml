- name: Download LlamaFarm CLI installer
  get_url:
    url: "https://raw.githubusercontent.com/llama-farm/llamafarm/main/install.sh"
    dest: /tmp/install-llamafarm.sh
    mode: 0555

- name: Install LlamaFarm CLI with version pin
  environment:
    VERSION: "{{ lf_version if lf_version != 'latest' else '' }}"
    LF_DATA_DIR: "{{ lf_data_dir }}"
  command: /tmp/install-llamafarm.sh
  args:
    creates: /usr/local/bin/lf

- name: Verify CLI installation
  command: lf version
  register: lf_version_out
  changed_when: no

- name: Log LlamaFarm version
  debug:
    msg: "LlamaFarm CLI: {{ lf_version_out.stdout }}"

- name: Symlink data dir to home
  file:
    src: "{{ lf_data_dir }}"
    dest: "/home/{{ lf_user }}/.llamafarm"
    state: link
    owner: "{{ lf_user }}"
    group: "{{ lf_group }}"
